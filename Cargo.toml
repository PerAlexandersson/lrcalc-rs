[package]
name = "lrcalc-rs"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
readme = "README.md"
description = "A Rust implementation providing a drop-in liblrcalc ABI and CLI surface."
keywords = ["lrcalc", "schur", "kostka", "schubert", "combinatorics"]

[lib]
name = "lrcalc"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "lrcalc"
path = "src/main.rs"

[dependencies]
libc = "0.2"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
