[package]
name = "lrcalc-rs"
version = "0.1.0-rc.1"
edition = "2021"
license = "GPL-3.0-or-later"
readme = "README.md"
description = "A Rust implementation providing a drop-in liblrcalc ABI and CLI surface."
repository = "https://github.com/PerAlexandersson/lrcalc-rs"
keywords = ["lrcalc", "schur", "kostka", "schubert", "combinatorics"]

[lib]
name = "lrcalc"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "lrcalc"
path = "src/main.rs"

[dependencies]
libc = "0.2"
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Keep release libraries and integration tests on the same panic strategy.
# Mixed abort/unwind builds collide on the un-hashed rlib/staticlib/cdylib
# output names and can load incompatible dependency identities on rebuild.
panic = "unwind"
